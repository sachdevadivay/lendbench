 late:()=>go(sb.from('bookings').update({overdue:true}).eq('id',id)),
 inc:()=>ask(canRev(cu(),r)?'Report incident':'Report a problem',[{k:'k',l:'Type',t:'select',o:cu().id===b.uid?['Equipment fault','Conflict','Other']:['Damage','Delay','Conflict','Other']},{k:'d',l:'What happened?',t:'textarea'}],v=>run(()=>addInc(b,v.k,v.d)),'Submit report'),
 det:()=>details(id)};A[t]()}
function resolve(id){const i=S.incidents.find(x=>x.id===id);
 ask('Resolve incident',[{t:'note',l:'You make the decision. The system only flags and summarises.'},{k:'x',l:'Decision',t:'select',o:['No action','Warning issued','Deposit retained or repair charged','Booking privileges paused (admin can review)']},{k:'n',l:'Explanation for the user',t:'textarea'}],
 v=>run(async()=>{await T(sb.from('incidents').update({status:'resolved',decision:v.x,decision_note:v.n}).eq('id',id));if(v.x.startsWith('Booking'))await T(sb.rpc('pause_user',{uid:i.uid}))}),'Resolve')}
const toggleRes=id=>go(sb.from('resources').update({active:!R(id).active}).eq('id',id));
const admin=(id,t)=>go(sb.from('profiles').update(t==='v'?{verified:true}:{paused:false}).eq('id',id));
async function setView(v){view=v;if(v==='inbox'){const ids=S.notes.filter(n=>n.to===me&&!n.read).map(n=>n.id);if(ids.length)await sb.from('notifications').update({read:true}).in('id',ids);S.notes.forEach(n=>n.read=true)}render()}
function details(id){const b=B(id),r=R(b.rid),u=U(b.uid);
 const tl=S.audit.filter(a=>a.bid===id).reverse().map(a=>'<li><b>'+esc(a.action)+'</b> by '+esc((U(a.actor)||{name:'System'}).name)+' <span class="mut">'+fmtT(a.t)+'</span><br>'+esc(a.detail)+'</li>').join('');
 const inc=S.incidents.filter(i=>i.bid===id).map(i=>'<li><b>'+esc(i.kind)+'</b> ('+i.status+'): '+esc(i.desc)+(i.decision?'<br>Decision: '+esc(i.decision)+'. '+esc(i.note):'')+'</li>').join('');
 openModal('<h3>'+esc(r.name)+'</h3><p class="mut">'+fmt(b)+' · '+esc(u.name)+' · <b>'+LBL[b.status]+'</b></p><p>'+esc(b.reason)+'</p>'+
 '<h2>Priority score: '+b.score+'</h2><table>'+b.parts.map(p=>'<tr><td>'+esc(p[0])+'</td><td>'+(p[1]>0?'+':'')+p[1]+'</td></tr>').join('')+'</table>'+
 '<h2>Condition record</h2><table><tr><th></th><th>Check-in</th><th>Return</th></tr><tr><td>Condition</td><td>'+(b.ci?b.ci.cond:'–')+'</td><td>'+(b.ret?b.ret.cond:'–')+'</td></tr><tr><td>Notes</td><td>'+esc(b.ci&&b.ci.notes||'–')+'</td><td>'+esc(b.ret&&b.ret.notes||'–')+'</td></tr></table>'+
 (inc?'<h2>Incidents</h2><ul class="tl">'+inc+'</ul>':'')+'<h2>History</h2><ul class="tl">'+tl+'</ul><div class="acts" style="margin-top:12px"><button onclick="closeModal()">Close</button></div>')}
const rows=l=>l.length?l.join(''):'<div class="empty">Nothing here yet.</div>';
function bRow(b){const r=R(b.rid),u=cu(),rev=canRev(u,r),own=b.uid===u.id,a=[];
 if(rev&&b.status==='pending')a.push('<button class="p" onclick="act(\''+b.id+'\',\'approve\')">Approve</button><button class="d" onclick="act(\''+b.id+'\',\'reject\')">Reject</button><button onclick="act(\''+b.id+'\',\'wait\')">Waiting list</button>');
 if(rev&&b.status==='checked_in'&&!b.overdue)a.push('<button onclick="act(\''+b.id+'\',\'late\')" title="Demo clock">Simulate overdue</button>');
 if(own&&b.status==='approved')a.push('<button class="p" onclick="act(\''+b.id+'\',\'in\')">Check in</button>');
 if(own&&b.status==='checked_in')a.push('<button class="p" onclick="act(\''+b.id+'\',\'out\')">Return</button>');
 if((own&&['pending','waitlisted','approved'].includes(b.status))||(rev&&b.status==='approved'))a.push('<button class="d" onclick="act(\''+b.id+'\',\'cancel\')">Cancel</button>');
 if((own||rev)&&b.status!=='cancelled'&&b.status!=='rejected')a.push('<button onclick="act(\''+b.id+'\',\'inc\')">Report</button>');
 a.push('<button onclick="act(\''+b.id+'\',\'det\')">Details</button>');
 const comp=rev&&b.status==='pending'?S.bookings.filter(x=>x.id!==b.id&&x.status==='pending'&&overlap(x,b)):[];
 return'<div class="row s-'+b.status+'"><div><b>'+esc(r.name)+'</b><span class="pill">'+LBL[b.status]+(b.overdue?' · overdue':'')+'</span><div class="mut">'+fmt(b)+(u.id!==b.uid?' · '+esc(U(b.uid).name):'')+' · '+esc(b.purpose)+' · priority '+b.score+'</div><div class="why">'+esc(b.reason)+'</div>'+
 (comp.length?'<div class="why" style="border-color:var(--warn)">Competing: '+comp.map(x=>esc(U(x.uid).name)+' (score '+x.score+')').join(', ')+'. Higher score is advisory; you decide.</div>':'')+'</div><div class="acts">'+a.join('')+'</div></div>'}
function vDiscover(){const u=cu(),cats=['All',...new Set(S.resources.map(r=>r.cat))],el=r=>r.requires.every(c=>u.certs.includes(c));
 const list=S.resources.filter(r=>r.active&&(F.cat==='All'||r.cat===F.cat)&&(!F.q||(r.name+r.loc+r.cat+r.rules).toLowerCase().includes(F.q.toLowerCase()))&&(!F.el||el(r)));
 return'<details class="g"><summary>Judge walkthrough: one full journey in about 5 minutes</summary><ol><li><b>Asha (student)</b>: in Discover, request Seminar room B2 for tomorrow. Try the oscilloscope: it is blocked until her credential is verified, so click Request verification.</li><li><b>Kiran (manager)</b>: open Bookings, verify the credential, then approve the request or reject it with a reason.</li><li><b>Asha</b>: open My bookings, check in with the starting condition, then return it marked Damaged.</li><li><b>Kiran</b>: open Incidents. The system flagged the damage, and a person resolves it with a decision.</li><li><b>Anyone</b>: Details on a booking and the Audit log show the full history. <b>Dr. Mehta (owner)</b> can list new equipment, and <b>Priya (admin)</b> sees everything.</li></ol></details>'+
 '<div class="bar"><input value="'+esc(F.q)+'" placeholder="Search equipment, rooms, places (press Enter)" aria-label="Search" onchange="F.q=this.value;render()"><select aria-label="Category" onchange="F.cat=this.value;render()">'+cats.map(c=>'<option'+(c===F.cat?' selected':'')+'>'+c+'</option>').join('')+'</select><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto"'+(F.el?' checked':'')+' onchange="F.el=this.checked;render()">Only what I can book now</label></div><h2>'+list.length+' resources</h2>'+
 rows(list.map(r=>{const miss=r.requires.filter(c=>!u.certs.includes(c));
  const chips=r.requires.length?r.requires.map(c=>'<span class="chip '+(u.role==='user'?(u.certs.includes(c)?'ok">✓ ':'no">✗ '):'">')+esc(c)+'</span>').join(''):'<span class="chip">No credential needed</span>';
  const pend=c=>S.certReqs.some(x=>x.uid===u.id&&x.cert===c&&x.status==='pending');
  return'<div class="row"><div><b>'+esc(r.name)+'</b><span class="pill" style="color:var(--mute)">'+esc(r.cat)+'</span><div class="mut">'+esc(r.loc)+' · owner '+esc(U(r.owner).name)+' · 09:00–18:00 · max '+r.maxHrs+' h · monthly cap '+r.cap+' h'+(r.deposit?' · deposit Rs '+r.deposit:'')+(r.sup?' · staff supervised':'')+'</div><div>'+chips+'</div><div class="why">'+esc(r.rules)+'</div>'+
  (u.role==='user'?'<div class="mut" style="margin-top:4px">'+(miss.length?'You are missing: '+miss.map(c=>esc(c)+(pend(c)?' (verification pending)':' <button onclick="askCert(\''+esc(c)+'\')">Request verification</button>')).join(', '):'You are eligible. Used '+used(u.id,r.id,tday())+' of '+r.cap+' h this month.')+'</div>':'')+'</div><div class="acts">'+(u.role==='user'?'<button class="p" onclick="openReq(\''+r.id+'\')">Request booking</button>':'<span class="mut">Switch to a student to book</span>')+'</div></div>'}))}
function vBookings(){const u=cu();let l=S.bookings.filter(b=>u.role==='admin'||b.uid===u.id||canRev(u,R(b.rid)));
 const ord={pending:0,checked_in:1,approved:2,waitlisted:3,returned:4,rejected:5,cancelled:6};l.sort((a,b)=>ord[a.status]-ord[b.status]||b.created.localeCompare(a.created));
 const rev=u.role==='owner'||u.role==='manager',cr=S.certReqs.filter(c=>c.status==='pending');
 return(rev&&cr.length?'<h2>Credential checks</h2>'+cr.map(c=>'<div class="row"><div><b>'+esc(U(c.uid).name)+'</b> asks to verify <b>'+esc(c.cert)+'</b><div class="mut">'+esc(U(c.uid).dept)+'. In a real deployment a certificate file would be attached.</div></div><div class="acts"><button class="p" onclick="certAct(\''+c.id+'\',true)">Verify</button><button class="d" onclick="certAct(\''+c.id+'\',false)">Decline</button></div></div>').join(''):'')+'<h2>'+(rev?'Requests and loans on your resources':'My bookings')+'</h2>'+rows(l.map(bRow))}
function vIncidents(){const u=cu(),l=S.incidents.filter(i=>u.role==='admin'||i.uid===u.id||canRev(u,R(i.rid)));
 return'<h2>Incidents</h2>'+rows(l.map(i=>{const b=B(i.bid),r=R(i.rid);return'<div class="row s-'+(i.status==='open'?'pending':'approved')+'"><div><b>'+esc(i.kind)+'</b><span class="pill">'+i.status+'</span><div class="mut">'+esc(r.name)+' · '+esc(U(i.uid).name)+' · reported by '+(i.by==='sys'?'system rules':esc(U(i.by).name))+' · '+fmtT(i.t)+'</div><div class="why">'+esc(i.desc)+(i.decision?'<br>Decision: '+esc(i.decision)+'. '+esc(i.note):'')+'</div></div><div class="acts"><button onclick="details(\''+b.id+'\')">Booking</button>'+(i.status==='open'&&canRev(u,r)?'<button class="p" onclick="resolve(\''+i.id+'\')">Resolve</button>':'')+'</div></div>'}))}
function vAudit(){const u=cu(),vis=a=>true;
 const l=S.audit.filter(vis);return'<h2>Audit log</h2><p class="mut">Every approval, rejection, cancellation, check-in, return and incident is recorded. You see entries you are involved in.</p>'+(l.length?'<div class="row" style="display:block"><table>'+l.map(a=>'<tr><td>'+fmtT(a.t)+'</td><td>'+esc((U(a.actor)||{name:'System'}).name)+'</td><td><b>'+esc(a.action)+'</b><br>'+esc(a.detail)+'</td></tr>').join('')+'</table></div>':rows([]))}
function vInbox(){const l=S.notes.filter(n=>n.to===me);return'<h2>Notifications</h2>'+rows(l.map(n=>'<div class="row"><div>'+esc(n.msg)+'<div class="mut">'+fmtT(n.t)+'</div></div></div>'))}
function vListings(){const u=cu();return'<div class="acts" style="justify-content:space-between"><h2>My listings</h2><button class="p" onclick="newRes()">List a resource</button></div>'+(u.verified?'':'<div class="row s-pending"><div>Your owner profile is awaiting admin verification. You can fill in listings only after verification.</div></div>')+
 rows(S.resources.filter(r=>r.owner===u.id).map(r=>'<div class="row"><div><b>'+esc(r.name)+'</b><span class="pill">'+(r.active?'Listed':'Paused')+'</span><div class="mut">'+esc(r.loc)+' · requires: '+(r.requires.join(', ')||'none')+' · max '+r.maxHrs+' h · cap '+r.cap+' h/month</div><div class="why">'+esc(r.rules)+'</div></div><div class="acts"><button onclick="toggleRes(\''+r.id+'\')">'+(r.active?'Pause listing':'Resume listing')+'</button></div></div>'))}
function newRes(){if(!cu().verified)return ask('Verification needed',[{t:'note',l:'An administrator must verify your owner profile before you can list resources. Ask Priya Nair (admin).'}],()=>{},'OK');
 ask('List a resource',[{k:'name',l:'Name'},{k:'cat',l:'Category',t:'select',o:['Fabrication','Electronics','Spaces','Media','Computing','Other']},{k:'loc',l:'Location'},{k:'req',l:'Required credentials (comma separated, blank for none)',req:0},{k:'max',l:'Max hours per booking',t:'number',v:'3'},{k:'cap',l:'Monthly cap per person (hours)',t:'number',v:'8'},{k:'dep',l:'Refundable deposit (Rs)',t:'number',v:'0'},{k:'sup',l:'Staff supervision required?',t:'select',o:['No','Yes']},{k:'rules',l:'Usage rules and conditions',t:'textarea'}],v=>run(async()=>{
  const [r]=await T(sb.from('resources').insert({owner_id:me,name:v.name,category:v.cat,location:v.loc,requires:v.req.split(',').map(s=>s.trim()).filter(Boolean),max_hrs:Math.max(1,+v.max),monthly_cap:Math.max(1,+v.cap),deposit:+v.dep,supervised:v.sup==='Yes',rules:v.rules}).select());
  const m=S.users.filter(x=>x.role==='manager').map(x=>({resource_id:r.id,user_id:x.id}));
  if(m.length)await T(sb.from('resource_managers').insert(m))}),'Publish listing')}
function vAdmin(){return'<h2>People and access</h2>'+rows(S.users.map(u=>'<div class="row"><div><b>'+esc(u.name)+'</b><span class="pill" style="color:var(--mute)">'+u.role+'</span><div class="mut">'+esc(u.dept)+' · '+(u.verified?'verified':'not verified')+(u.paused?' · privileges paused':'')+(u.certs.length?' · credentials: '+esc(u.certs.join(', ')):'')+'</div></div><div class="acts">'+(u.verified?'':'<button class="p" onclick="admin(\''+u.id+'\',\'v\')">Verify profile</button>')+(u.paused?'<button class="p" onclick="admin(\''+u.id+'\',\'r\')">Restore access</button>':'')+'</div></div>'))}

/* ---- login, render, start ---- */
const vLogin=()=>'<h2>Sign in</h2><form class="row" style="display:block;max-width:380px" onsubmit="signIn(event)"><label for="e">Email</label><input id="e" name="e" type="email" required><label for="p">Password</label><input id="p" name="p" type="password" required><div class="err" id="lerr" role="alert"></div><button class="p">Sign in</button><p class="mut">Test accounts and password are in the submission notes.</p></form>';
async function signIn(e){e.preventDefault();const f=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:f.get('e'),password:f.get('p')});if(error)$('#lerr').textContent=error.message;else boot()}
async function signOut(){await sb.auth.signOut();me=null;render()}
async function boot(){const {data}=await sb.auth.getSession();if(!data.session){me=null;return render()}me=data.session.user.id;
 try{await reload()}catch(e){alert('Could not load data: '+e.message)}
 const u=cu();if(u){view=u.role==='user'?'discover':u.role==='admin'?'audit':'bookings';render()}}
function render(){
 if(!me){$('#who').innerHTML='';$('#nav').innerHTML='';$('#app').innerHTML=vLogin();return}
 const u=cu();if(!u){$('#app').innerHTML='<div class="empty">Signed in, but no profile row exists. Check the signup trigger in the SQL file.</div>';return}
 const unread=S.notes.filter(n=>n.to===me&&!n.read).length;
 $('#who').innerHTML='<b>'+esc(u.name)+'</b>'+u.role+(u.verified?'':' · awaiting verification')+(u.paused?' · privileges paused':'');
 const tabs=[['discover','Discover'],['bookings',u.role==='user'?'My bookings':'Bookings'],['incidents','Incidents'],['audit','Audit log'],['inbox','Inbox'+(unread?' ('+unread+')':'')]];
 if(u.role==='owner')tabs.splice(1,0,['listings','My listings']);if(u.role==='admin')tabs.push(['admin','People']);
 if(!tabs.some(t=>t[0]===view))view='discover';
 $('#nav').innerHTML=tabs.map(t=>'<button onclick="setView(\''+t[0]+'\')"'+(t[0]===view?' aria-current="page"':'')+'>'+t[1]+'</button>').join('');
 $('#app').innerHTML=({discover:vDiscover,bookings:vBookings,incidents:vIncidents,audit:vAudit,inbox:vInbox,listings:vListings,admin:vAdmin})[view]()}
boot();
</script></body></html>
